<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BusMate Driver Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='modern.css') }}"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#eaf5ff,#dceeff);font-family:Arial,sans-serif;color:#10233f}.card{width:min(460px,100%);padding:34px;background:#fff;border-radius:22px;box-shadow:0 20px 55px #082d5c24}.logo{width:180px;max-height:70px;object-fit:contain;margin-bottom:20px}.icon{font-size:48px}.card h1{margin:8px 0;color:#082d5c}.sub{color:#64748b;line-height:1.5;margin-bottom:24px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #d5e3f1;border-radius:11px;padding:0 13px;font-size:15px}.btn{width:100%;height:48px;border:0;border-radius:11px;background:#0b6ff5;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}.links a{color:#075fce;font-weight:700;text-decoration:none}#message{display:none;background:#fff1f2;color:#be123c;padding:11px;border-radius:9px;margin:12px 0}
</style></head><body><main class="card"><img class="logo" src="{{ url_for('static', filename='rit-logo.png') }}" alt="RIT"><div class="icon">🚌</div><h1>Driver Login</h1><p class="sub">Sign in to open your BusMate driver dashboard and share live bus location.</p><div id="message" role="alert"></div><form id="driverLoginForm"><div class="field"><label for="driver_name">Driver Name</label><input id="driver_name" name="driver_name" autocomplete="name" required placeholder="Enter your registered name"></div><div class="field"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="Enter your registered phone number"></div><button class="btn" id="loginButton" type="submit">Login to Driver Dashboard</button></form><div class="links"><a href="/driver/register">New driver? Register</a><a href="/">Main login</a></div></main><script>
const form=document.getElementById('driverLoginForm'), msg=document.getElementById('message'), btn=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='Logging in...';try{const r=await fetch('/driver/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)),credentials:'same-origin'});const d=await r.json();if(r.ok&&d.success){location.href=d.redirect;return;}msg.textContent=d.message||'Login failed. Check your details.';msg.style.display='block';}catch(e){msg.textContent='Unable to connect to the server. Make sure BusMate is running.';msg.style.display='block';}btn.disabled=false;btn.textContent='Login to Driver Dashboard';});
</script></body></html>
